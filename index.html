<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saturncraft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23e8c890' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23d8a860'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="screens"></div>
  <div id="title-screen" class="screen">
    <canvas id="title-bg"></canvas>
    <div class="title-wrap"><h1>SATURNCRAFT</h1><div id="splash"></div></div>
    <p class="sub">Three suns. One ringed giant. Survive.</p>
    <div class="field"><label for="pname">Your name</label><input type="text" id="pname" maxlength="16" /></div>
    <div id="worlds" class="world-list"></div>
    <div class="field"><label for="wname">World name</label><input type="text" id="wname" maxlength="24" placeholder="New World" /></div>
    <div class="field"><label for="seed">World seed</label><input type="text" id="seed" placeholder="random" /></div>
    <div class="field"><label>Render distance: <b id="t-rdv">8</b> chunks</label><input type="range" id="t-rd" min="2" max="16" value="8" /></div>
    <div class="field"><label><input type="checkbox" id="t-sh" checked /> Sun shadows</label></div>
    <button class="btn" id="play">Create New World</button>
    <div class="join-row"><input type="text" id="join-code" placeholder="Room code" maxlength="64" /><button class="btn" id="join">Join a Friend</button></div>
    <p class="sub" id="join-msg"></p>
    <p class="sub" style="margin-top:14px;font-size:13px">WASD move · Space jump · Shift sneak · Ctrl sprint · E inventory · T chat · F5 camera · Esc pause</p>
  </div>
  <div id="loading" class="hidden"><div>Generating terrain…</div><div class="bar"><div></div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
