<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Saturncraft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23e8c890' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23d8a860'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="screens"></div>
  <div id="title-screen" class="screen">
    <canvas id="title-bg"></canvas>
    <div class="title-wrap"><h1>SATURNCRAFT</h1><div id="splash"></div></div>
    <p class="sub" data-i18n>Three suns. One ringed giant. Survive.</p>
    <div class="field lang-field"><label for="t-lang" data-i18n>Language</label><select id="t-lang"></select></div>
    <div class="field"><label for="pname" data-i18n>Your name</label><input type="text" id="pname" maxlength="16" /></div>
    <div id="storage-note" class="wm-note hidden"></div>
    <div id="worlds" class="world-list"></div>
    <p class="sub" id="wm-msg"></p>
    <div class="btn-row wm-tools"><button class="btn" id="import-btn" title="Add a world from a .saturnworld file" data-i18n data-i18n-attr="title">Import world…</button></div>
    <input type="file" id="import-file" accept=".saturnworld,application/gzip,application/octet-stream" hidden />
    <div class="field"><label for="wname" data-i18n>World name</label><input type="text" id="wname" maxlength="24" placeholder="New World" data-i18n-attr="placeholder" /></div>
    <div class="field"><label for="seed" data-i18n>World seed</label><input type="text" id="seed" maxlength="64" placeholder="random (any text or number)" data-i18n-attr="placeholder" /></div>
    <details id="world-options" class="wm-options">
      <summary data-i18n>More world options</summary>
      <div class="wm-grid">
        <label><span data-i18n>World type</span> <select id="wo-type"></select></label>
        <label><span data-i18n>Game mode</span> <select id="wo-mode"><option value="survival" data-i18n>Survival</option><option value="creative" data-i18n>Creative</option><option value="adventure" data-i18n>Adventure</option></select></label>
        <label><span data-i18n>Difficulty</span> <select id="wo-diff"><option value="peaceful" data-i18n>Peaceful</option><option value="easy" data-i18n>Easy</option><option value="normal" selected data-i18n>Normal</option><option value="hard" data-i18n>Hard</option></select></label>
        <label><input type="checkbox" id="wo-cheats" checked /> <span data-i18n>Allow cheats (commands)</span></label>
        <label><input type="checkbox" id="wo-seasons" checked /> <span data-i18n>Seasons</span></label>
        <label><span data-i18n>Starting season</span> <select id="wo-start"><option value="spring" data-i18n>Spring</option><option value="summer" data-i18n>Summer</option><option value="autumn" data-i18n>Autumn</option><option value="winter" data-i18n>Winter</option></select></label>
        <label><span data-i18n>Days per season</span> <input type="number" id="wo-days" min="1" max="120" value="8" /></label>
        <label><input type="checkbox" id="wo-daylight" checked /> <span data-i18n>Day/night cycle</span></label>
        <label><input type="checkbox" id="wo-hostile" checked /> <span data-i18n>Hostile mobs</span></label>
        <label><input type="checkbox" id="wo-events" checked /> <span data-i18n>World events</span></label>
        <label><input type="checkbox" id="wo-fwhurt" /> <span data-i18n>Fireworks hurt players</span></label>
        <label><input type="checkbox" id="wo-keepinv" /> <span data-i18n>Keep inventory on death</span></label>
        <label title="Survival on Hard without cheats. When you die the world can only be watched." data-i18n-attr="title"><input type="checkbox" id="wo-hardcore" /> <span data-i18n>One Life (hardcore)</span></label>
        <label title="Starts with a flat yard where the Rift portal and the Hollow Gate stand lit side by side, in creative mode." data-i18n-attr="title"><input type="checkbox" id="wo-portalyard" /> <span data-i18n>Portal test yard</span></label>
      </div>
    </details>
    <div class="field"><label><span data-i18n>Render distance:</span> <b id="t-rdv">8</b> <span data-i18n>chunks</span></label><input type="range" id="t-rd" min="2" max="16" value="8" /></div>
    <div class="field"><label><input type="checkbox" id="t-sh" checked /> <span data-i18n>Sun shadows</span></label> <label><input type="checkbox" id="t-fx" checked /> <span data-i18n>Shaders</span></label></div>
    <button class="btn" id="play">Create New World</button>
    <div class="join-row"><input type="text" id="join-code" placeholder="Room code" maxlength="64" data-i18n-attr="placeholder" /><button class="btn" id="join" data-i18n>Join a Friend</button></div>
    <p class="sub" id="join-msg"></p>
    <p class="sub" id="controls-hint" data-i18n style="margin-top:14px;font-size:13px">WASD move · Space jump · Shift sneak · Ctrl sprint · E inventory · T chat · F1 help · F5 camera · F7 shaders · Esc pause</p>
  </div>
  <div id="loading" class="hidden"><div data-i18n>Generating terrain…</div><div class="bar"><div></div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
