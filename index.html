<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Saturncraft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='16' rx='15' ry='5' fill='none' stroke='%23e8c890' stroke-width='2' transform='rotate(-20 16 16)'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23d8a860'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <div id="screens"></div>
  <div id="title-screen" class="screen">
    <canvas id="title-bg"></canvas>
    <div class="title-wrap"><h1>SATURNCRAFT</h1><div id="splash"></div></div>
    <p class="sub">Three suns. One ringed giant. Survive.</p>
    <div class="field"><label for="pname">Your name</label><input type="text" id="pname" maxlength="16" /></div>
    <div id="storage-note" class="wm-note hidden"></div>
    <div id="worlds" class="world-list"></div>
    <p class="sub" id="wm-msg"></p>
    <div class="btn-row wm-tools"><button class="btn" id="import-btn" title="Add a world from a .saturnworld file">Import world…</button></div>
    <input type="file" id="import-file" accept=".saturnworld,application/gzip,application/octet-stream" hidden />
    <div class="field"><label for="wname">World name</label><input type="text" id="wname" maxlength="24" placeholder="New World" /></div>
    <div class="field"><label for="seed">World seed</label><input type="text" id="seed" maxlength="64" placeholder="random (any text or number)" /></div>
    <details id="world-options" class="wm-options">
      <summary>More world options</summary>
      <div class="wm-grid">
        <label>World type <select id="wo-type"></select></label>
        <label>Game mode <select id="wo-mode"><option value="survival">Survival</option><option value="creative">Creative</option><option value="adventure">Adventure</option></select></label>
        <label>Difficulty <select id="wo-diff"><option value="peaceful">Peaceful</option><option value="easy">Easy</option><option value="normal" selected>Normal</option><option value="hard">Hard</option></select></label>
        <label><input type="checkbox" id="wo-cheats" checked /> Allow cheats (commands)</label>
        <label><input type="checkbox" id="wo-seasons" checked /> Seasons</label>
        <label>Starting season <select id="wo-start"><option value="spring">Spring</option><option value="summer">Summer</option><option value="autumn">Autumn</option><option value="winter">Winter</option></select></label>
        <label>Days per season <input type="number" id="wo-days" min="1" max="120" value="8" /></label>
        <label><input type="checkbox" id="wo-daylight" checked /> Day/night cycle</label>
        <label><input type="checkbox" id="wo-hostile" checked /> Hostile mobs</label>
        <label><input type="checkbox" id="wo-events" checked /> World events</label>
        <label><input type="checkbox" id="wo-fwhurt" /> Fireworks hurt players</label>
      </div>
    </details>
    <div class="field"><label>Render distance: <b id="t-rdv">8</b> chunks</label><input type="range" id="t-rd" min="2" max="16" value="8" /></div>
    <div class="field"><label><input type="checkbox" id="t-sh" checked /> Sun shadows</label> <label><input type="checkbox" id="t-fx" checked /> Shaders</label></div>
    <button class="btn" id="play">Create New World</button>
    <div class="join-row"><input type="text" id="join-code" placeholder="Room code" maxlength="64" /><button class="btn" id="join">Join a Friend</button></div>
    <p class="sub" id="join-msg"></p>
    <p class="sub" id="controls-hint" style="margin-top:14px;font-size:13px">WASD move · Space jump · Shift sneak · Ctrl sprint · E inventory · T chat · F5 camera · F7 shaders · Esc pause</p>
  </div>
  <div id="loading" class="hidden"><div>Generating terrain…</div><div class="bar"><div></div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
